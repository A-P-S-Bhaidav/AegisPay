<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AegisPay Agentic Side Panel</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, sans-serif;
        background: #050507;
        color: #f8fafc;
      }
      body {
        margin: 0;
        padding: 14px;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1.5px solid #0047ff;
        padding-bottom: 10px;
        margin-bottom: 12px;
      }
      .brand {
        font-weight: 800;
        font-size: 12px;
        letter-spacing: 0.06em;
        color: #f8fafc;
      }
      .badge {
        font-family: monospace;
        font-size: 10px;
        font-weight: 800;
        padding: 3px 7px;
        background: #ccff00;
        color: #050507;
      }
      .quick-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 8px;
      }
      label {
        display: block;
        font-family: monospace;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #94a3b8;
        margin-top: 10px;
        margin-bottom: 4px;
      }
      textarea, input {
        width: 100%;
        box-sizing: border-box;
        background: #0a0c12;
        border: 1px solid #1e2433;
        color: #f8fafc;
        border-radius: 2px;
        padding: 8px 10px;
        font-size: 12px;
      }
      textarea:focus, input:focus {
        outline: none;
        border-color: #0047ff;
      }
      button {
        width: 100%;
        margin-top: 8px;
        padding: 9px 12px;
        border: 1.5px solid #0047ff;
        border-radius: 2px;
        background: #ccff00;
        color: #050507;
        font-weight: 800;
        font-size: 11px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        box-shadow: 3px 3px 0 #0047ff;
        cursor: pointer;
      }
      button.secondary {
        background: #0a0c12;
        color: #f8fafc;
        border: 1px solid #1e2433;
        box-shadow: none;
      }
      button.cobalt {
        background: #0047ff;
        color: #f8fafc;
        border: 1.5px solid #ccff00;
        box-shadow: 3px 3px 0 #ccff00;
      }
      .result-card {
        margin-top: 12px;
        padding: 12px;
        border-radius: 2px;
        background: #0a0c12;
        border: 1.5px solid #0047ff;
        font-size: 12px;
      }
      .mono {
        font-family: monospace;
        font-size: 10px;
        word-break: break-all;
        color: #94a3b8;
      }
      .link-btn {
        display: block;
        text-align: center;
        margin-top: 8px;
        padding: 8px 10px;
        background: #0047ff;
        color: #ffffff;
        text-decoration: none;
        font-weight: 800;
        font-size: 11px;
        text-transform: uppercase;
        border: 1px solid #ccff00;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="brand">AEGISPAY AGENT</div>
      <span class="badge">MV3 v3.2</span>
    </div>

    <button id="scanPageBtn" type="button" class="cobalt">1-Click Auto-Scan Active Webpage</button>
    <div class="quick-row">
      <button id="pasteClipBtn" type="button" class="secondary">Paste Clipboard</button>
      <button id="injectScamBtn" type="button" class="secondary">Load Scam Sample</button>
    </div>

    <label for="payeeInput">Detected Payee / Merchant</label>
    <input id="payeeInput" type="text" value="billing@FreelanceStudio.io" />

    <label for="amountInput">Detected Amount (USD)</label>
    <input id="amountInput" type="number" step="0.01" value="45.00" />

    <label for="textInput">Webpage / Invoice / Statement Text</label>
    <textarea id="textInput" rows="4">Invoice #1049 for UI Icons Milestone: $45.00 USD via PayPal Checkout.</textarea>

    <button id="scanBtn" type="button">Scan &amp; Unlock PayPal Checkout</button>
    <button id="agentIngestBtn" type="button" class="secondary">Run 1-Click Universal Agent Action</button>

    <div id="resultBox" class="result-card" hidden>
      <div id="verdictTitle" style="font-weight: 800; font-size: 13px; margin-bottom: 6px;"></div>
      <div id="verdictSummary" style="margin-bottom: 8px; line-height: 1.4;"></div>
      <div id="tokenBox" class="mono"></div>
      <button id="createPayPalOrderBtn" type="button" hidden>Open Verified PayPal Checkout</button>
      <a id="paypalCheckoutLink" class="link-btn" href="#" target="_blank" rel="noreferrer" hidden>Launch PayPal Sandbox Approval</a>
    </div>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
