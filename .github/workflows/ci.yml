name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # Tier 1-3: type safety, unit tests, integration tests, API-level end-to-end journeys.
  verify:
    name: Typecheck, unit, integration & API E2E (with coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + integration + API E2E (Vitest) with coverage
        run: npm run test:coverage
      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
              console.log("### Coverage (server + shared)\n\n| Metric | % | Covered |\n|---|---|---|");
              ["lines","statements","functions","branches"].forEach((k) => console.log(row(k)));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  # Production build must succeed and ship a valid Chrome extension archive.
  build:
    name: Production build & extension packaging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify extension ZIP integrity and Manifest V3
        run: |
          unzip -t public/extension.zip
          unzip -p public/extension.zip manifest.json | node -e '
            let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
              const m = JSON.parse(s);
              if (m.manifest_version !== 3) { console.error("not Manifest V3"); process.exit(1); }
              console.log("extension manifest OK:", m.name, m.version);
            });'
      - name: Dist output exists
        run: test -f dist/index.html && ls -la dist/assets | head

  # Tier 4: real Chromium driving the production build served by the real server.
  e2e-browser:
    name: Browser E2E (Playwright / Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Supply-chain signal. Reports high/critical advisories in shipped (non-dev) dependencies.
  audit:
    name: Dependency audit (production deps)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
